<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>User Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* Landing page: one card per study, same tokens as the study pages. */
:root { --bg: #f4f5f7; --panel: #ffffff; --ink: #15171f; --muted: #5b6070; --line: #d9dce4; --accent: #2f5bd3; --accent-ink: #ffffff;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111217; --panel: #1a1c24; --ink: #e9eaf0; --muted: #9da1b1; --line: #2c2f3b; --accent: #8ea8ff; --accent-ink: #0d1020; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111217; --panel: #1a1c24; --ink: #e9eaf0; --muted: #9da1b1; --line: #2c2f3b; --accent: #8ea8ff; --accent-ink: #0d1020; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); padding: 0 16px }
main { max-width: 660px; margin: max(24px, 8vh) auto 40px; display: grid; gap: 16px }
h1 { font: 700 1.75rem/1.15 var(--body); margin: 0; letter-spacing: -.015em }
p { margin: 0; color: var(--muted) }
a.study { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
  color: inherit; text-decoration: none }
a.study:hover { border-color: var(--accent) } a.study:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
a.study b { font-size: 1.1rem } a.study span { color: var(--muted) } a.study i { font-style: normal; color: var(--accent); font-weight: 600 }
</style>
</head>
<body>
<main>
  <h1>User studies</h1>
  <p>Thank you for helping. Each study takes about 5 minutes and is anonymous.</p>
  <a class="study" href="ranking/"><b>Motion transfer: rank the videos</b>
    <span>10 examples. In each, put four videos in order from best to worst.</span><i>Start →</i></a>
</main>
</body>
</html>
